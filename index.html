        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .meal-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        .divider { height: 1px; background: rgba(0,0,0,0.06); }

            background: rgba(253,252,250,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.06);

            background: none; border: none; cursor: pointer;
            letter-spacing: 0.03em; text-transform: uppercase;
            font-weight: 500;

        .tab-item-active { color: #2C2C2C; }

            background: #FDFCFA;
            font-size: 14px;
            color: #2C2C2C;

        // ─── HELPERS ──────────────────────────────────────────────────
        function calcWeek(dueDateStr) {
            if (!dueDateStr) return null;
            const due = new Date(dueDateStr + 'T00:00:00');
            const now = new Date();
            const daysLeft = Math.ceil((due - now) / 86400000);
            const week = Math.floor((280 - daysLeft) / 7) + 1;
            return Math.max(1, Math.min(40, week));
        }
        function lmpToDue(lmpStr) {
            if (!lmpStr) return null;
            const d = new Date(lmpStr + 'T00:00:00');
            d.setDate(d.getDate() + 280);
            return d.toISOString().split('T')[0];
        }

        // ─── ONBOARDING ──────────────────────────────────────────────
        function Onboarding({ onComplete }) {
            const [mode, setMode] = useState(null);
            const [val, setVal] = useState('');
            const submit = () => {
                if (!val) return;
                const due = mode === 'lmp' ? lmpToDue(val) : val;
                localStorage.setItem('eb-due', due);
                onComplete(due);
            };
            return (
                <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
                    <div className="animate-up" style={{ maxWidth: 420, width: '100%', textAlign: 'center' }}>

                        <p style={{ fontSize: 14, color: '#8A8580', marginBottom: 40, letterSpacing: '0.02em' }}>Your pregnancy companion</p>

                        {!mode && (

                                <button onClick={() => setMode('due')} className="card" style={{ padding: '20px 24px', textAlign: 'left', cursor: 'pointer', border: '1px solid rgba(0,0,0,0.08)' }}>

                                    <p style={{ fontSize: 13, color: '#8A8580' }}>Enter your estimated due date</p>
                                </button>
                                <button onClick={() => setMode('lmp')} className="card" style={{ padding: '20px 24px', textAlign: 'left', cursor: 'pointer', border: '1px solid rgba(0,0,0,0.08)' }}>
                                    <p style={{ fontSize: 15, fontWeight: 500, marginBottom: 4 }}>I know my last period date</p>
                                    <p style={{ fontSize: 13, color: '#8A8580' }}>We'll calculate your due date</p>
                                </button>
                            </div>
                        )}

                        {mode && (
                            <div className="animate-in" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                                <p style={{ fontSize: 14, color: '#5A5550' }}>
                                    {mode === 'due' ? 'When is your due date?' : 'First day of your last period?'}
                                </p>
                                <input type="date" value={val} onChange={e => setVal(e.target.value)} style={{ textAlign: 'center', fontSize: 16 }} />
                                {mode === 'lmp' && val && (
                                    <p style={{ fontSize: 13, color: '#8A8580' }}>
                                        Estimated due date: {new Date(lmpToDue(val) + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}
                                    </p>
                                )}
                                <div style={{ display: 'flex', gap: 12 }}>
                                    <button onClick={() => { setMode(null); setVal(''); }} className="btn-outline" style={{ flex: 1 }}>Back</button>
                                    <button onClick={submit} disabled={!val} className="btn-primary" style={{ flex: 1 }}>Begin</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ─── WATER TRACKER ────────────────────────────────────────────
        function WaterTracker() {
            const [g, setG] = useState(() => {
                const s = localStorage.getItem('eb-water-' + new Date().toDateString());
                return s ? parseInt(s) : 0;
            });
            useEffect(() => { localStorage.setItem('eb-water-' + new Date().toDateString(), g); }, [g]);
            return (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center' }}>
                    {Array.from({ length: 10 }).map((_, i) => (
                        <button key={i} onClick={() => setG(i + 1)}
                            style={{ width: 32, height: 36, borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 16,
                                background: i < g ? '#D5E3F0' : '#EDEAE5', transition: 'all 0.2s',
                                transform: i < g ? 'scale(1.05)' : 'scale(1)' }}>
                            {i < g ? '💧' : '·'}
                        </button>
                    ))}

                                                    <label key={ti} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6, cursor: 'pointer' }}>
                                                        <input type="checkbox" checked={checks[`${cp.week}-${ti}`]||false} onChange={() => toggleCheck(cp.week,ti)} className="check-custom" style={{ width: 18, height: 18 }} />
                                                        <span style={{ fontSize: 13, color: checks[`${cp.week}-${ti}`] ? '#A09890' : '#5A5550', textDecoration: checks[`${cp.week}-${ti}`] ? 'line-through' : 'none' }}>{t}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* JOURNAL TAB */}
                        {tab === 'journal' && (
                            <div className="animate-up" style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                                <div style={{ textAlign: 'center', paddingTop: 8 }}>
                                    <h2 className="font-serif" style={{ fontSize: 32, fontWeight: 300 }}>Journal</h2>
                                    <p style={{ fontSize: 13, color: '#8A8580', marginTop: 4 }}>Capture your memories</p>
                                </div>

                                <div className="card" style={{ padding: 24 }}>
                                    <h3 style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#8A8580', marginBottom: 12 }}>Week {week}</h3>
                                    <textarea value={jText} onChange={e => setJText(e.target.value)}
                                        placeholder="How are you feeling today?" style={{ height: 120, marginBottom: 16 }} />
                                    <button onClick={saveJ} className="btn-primary">Save Entry</button>
                                </div>

                                {Object.entries(journal).sort((a, b) => b[0] - a[0]).map(([w, entries]) => (
                                    <div key={w} className="card" style={{ padding: 24 }}>
                                        <h3 style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#8A8580', marginBottom: 12 }}>Week {w}</h3>
                                        {entries.map((e, i) => (
                                            <div key={i} style={{ paddingTop: i > 0 ? 14 : 0, marginTop: i > 0 ? 14 : 0, borderTop: i > 0 ? '1px solid #EDEAE5' : 'none' }}>
                                                <p style={{ fontSize: 14, lineHeight: 1.7, color: '#5A5550' }}>{e.text}</p>
                                                <p style={{ fontSize: 11, color: '#A09890', marginTop: 6 }}>{e.date}</p>
                                            </div>
                                        ))}
                                    </div>
                                ))}

                                {Object.keys(journal).length === 0 && (
                                    <div style={{ textAlign: 'center', padding: '40px 0', color: '#A09890' }}>
                                        <p style={{ fontSize: 14 }}>Your journal is empty. Start writing.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Tab Bar */}
                    <nav className="tab-bar" style={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50 }}>
                        <div style={{ maxWidth: 560, margin: '0 auto', display: 'flex', justifyContent: 'space-around', padding: '8px 0 env(safe-area-inset-bottom, 8px)' }}>
                            {[
                                { id: 'home', label: 'Home', icon: '✿' },
                                { id: 'nutrition', label: 'Nutrition', icon: '◉' },
                                { id: 'workout', label: 'Movement', icon: '◎' },
                                { id: 'doctor', label: 'Appts', icon: '◈' },
                                { id: 'journal', label: 'Journal', icon: '◇' }
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)}
                                    className={`tab-item ${tab === t.id ? 'tab-item-active' : ''}`}>
                                    <span style={{ fontSize: 18 }}>{t.icon}</span>
                                    <span>{t.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
