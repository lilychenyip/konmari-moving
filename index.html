        .font-hand { font-family: 'Caveat', cursive; }

        /* Watercolor effect */
        .watercolor-blob {
            filter: url(#watercolor);
            opacity: 0.85;
        }
        .watercolor-card {
            background: linear-gradient(135deg, rgba(255,228,225,0.4), rgba(255,240,230,0.3), rgba(230,240,255,0.3));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,200,180,0.3);
        }
        .watercolor-bg {
            background: linear-gradient(180deg, #FFF9F5 0%, #FFF0EA 30%, #F8F0FF 60%, #FFF9F5 100%);
        }

        /* Soft scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E8C4B8; border-radius: 3px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }

        .tab-active {
            background: linear-gradient(135deg, #F9A8D4, #C4B5FD);
            color: white;
            box-shadow: 0 4px 15px rgba(249,168,212,0.3);
        }

        .progress-ring { transition: stroke-dashoffset 0.8s ease-in-out; }

        .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .recipe-card { transition: all 0.3s ease; }

        .workout-card:hover { transform: scale(1.02); }
        .workout-card { transition: all 0.3s ease; }

        .checkbox-custom {
            appearance: none;
            width: 20px; height: 20px;
            border: 2px solid #E8C4B8;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-custom:checked {
            background: linear-gradient(135deg, #F9A8D4, #C4B5FD);
            border-color: transparent;
        }

        // ─── WATERCOLOR FRUIT SVG COMPONENT ──────────────────────────
        function WatercolorFruit({ fruit, size, color, fruitEmoji }) {
            const sizeNum = parseFloat(size);
            const displaySize = Math.min(40 + sizeNum * 2.5, 160);

            return (
                <div className="relative flex items-center justify-center" style={{ width: displaySize + 40, height: displaySize + 40 }}>
                    <svg width={displaySize + 40} height={displaySize + 40} viewBox="0 0 200 200">
                        <defs>
                            <filter id={`wc-${fruit.replace(/\s/g,'')}`}>
                                <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="5" result="turbulence" seed={fruit.length * 7}/>
                                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="12" xChannelSelector="R" yChannelSelector="G"/>
                            </filter>
                            <radialGradient id={`grad-${fruit.replace(/\s/g,'')}`} cx="40%" cy="40%">
                                <stop offset="0%" stopColor={color} stopOpacity="0.9"/>
                                <stop offset="60%" stopColor={color} stopOpacity="0.5"/>
                                <stop offset="100%" stopColor={color} stopOpacity="0.15"/>
                            </radialGradient>
                        </defs>
                        <circle cx="100" cy="100" r="80" fill={`url(#grad-${fruit.replace(/\s/g,'')})`} filter={`url(#wc-${fruit.replace(/\s/g,'')})`} />
                        <circle cx="100" cy="100" r="60" fill={color} opacity="0.2" filter={`url(#wc-${fruit.replace(/\s/g,'')})`} />
                    </svg>
                    <span className="absolute text-center animate-float" style={{ fontSize: Math.min(displaySize * 0.5, 70) }}>
                        {fruitEmoji}
                    </span>
                </div>
            );
        }

        // ─── TRIMESTER BADGE ─────────────────────────────────────────

            return (
                <span className={`inline-block px-3 py-1 rounded-full text-white text-xs font-medium bg-gradient-to-r ${colors[trimester]}`}>
                    {labels[trimester]}
                </span>
            );
        }

        // ─── PROGRESS RING ──────────────────────────────────────────
        function ProgressRing({ week, totalWeeks = 40 }) {
            const radius = 54;
            const circumference = 2 * Math.PI * radius;
            const progress = (week / totalWeeks) * circumference;
            const percentage = Math.round((week / totalWeeks) * 100);

            return (
                <div className="relative inline-flex items-center justify-center">
                    <svg width="130" height="130" viewBox="0 0 130 130">
                        <circle cx="65" cy="65" r={radius} fill="none" stroke="#F3E8FF" strokeWidth="8"/>
                        <circle cx="65" cy="65" r={radius} fill="none" stroke="url(#ring-gradient)" strokeWidth="8"
                            strokeDasharray={circumference} strokeDashoffset={circumference - progress}
                            strokeLinecap="round" transform="rotate(-90 65 65)" className="progress-ring"/>
                        <defs>
                            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stopColor="#F9A8D4"/>
                                <stop offset="100%" stopColor="#C4B5FD"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div className="absolute text-center">
                        <div className="text-2xl font-bold font-display bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">{percentage}%</div>
                        <div className="text-[10px] text-gray-400">complete</div>
                    </div>
                </div>
            );
        }

                                    const allCompleted = completedCount === dayExercises.length;

                                    return (
                                        <div className="watercolor-card rounded-2xl p-5">
                                            <div className="flex items-center justify-between mb-4">
                                                <div>
                                                    <h3 className="font-display font-semibold text-lg">{dayPlan.title}</h3>
                                                    <p className="text-xs text-gray-400">⏱ {dayPlan.duration}</p>
                                                </div>
                                                {allCompleted && <span className="text-2xl animate-float">🎉</span>}
                                            </div>

                                            {/* Progress Bar */}
                                            <div className="h-2 rounded-full bg-gray-100 mb-4 overflow-hidden">
                                                <div className="h-full rounded-full bg-gradient-to-r from-purple-400 to-pink-400 transition-all duration-500"
                                                    style={{ width: `${(completedCount / dayExercises.length) * 100}%` }}></div>
                                            </div>
                                            <p className="text-xs text-gray-400 mb-4">{completedCount}/{dayExercises.length} completed</p>

                                            <div className="space-y-3">
                                                {dayExercises.map((ex, i) => {
                                                    const isComplete = completedWorkouts[`${currentWeek}-${selectedDay}-${i}`];
                                                    return (
                                                        <div key={i} className={`workout-card flex items-center gap-3 p-3 rounded-xl transition-all ${
                                                            isComplete ? 'bg-green-50/60' : 'bg-white/40'
                                                        }`}>
                                                            <input type="checkbox" checked={isComplete || false}
                                                                onChange={() => toggleWorkout(selectedDay, i)}
                                                                className="checkbox-custom" />
                                                            <div className="flex-1">
                                                                <p className={`text-sm font-medium ${isComplete ? 'line-through text-gray-400' : ''}`}>{ex.name}</p>
                                                                <div className="flex items-center gap-2 mt-0.5">
                                                                    {ex.duration && <span className="text-xs text-purple-400">⏱ {ex.duration}</span>}
                                                                    {ex.reps && <span className="text-xs text-pink-400">🔄 {ex.reps}</span>}
                                                                </div>
                                                                {ex.note && <p className="text-xs text-gray-400 mt-0.5">{ex.note}</p>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {/* Tab: Doctor */}
                        {activeTab === 'doctor' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">Doctor Checkpoints</h2>
                                    <p className="text-sm text-gray-400 mt-1">Your prenatal care timeline</p>
                                </div>

                                <div className="relative">
                                    {/* Timeline Line */}
                                    <div className="absolute left-6 top-0 bottom-0 w-0.5 bg-gradient-to-b from-pink-300 via-purple-300 to-pink-300"></div>

                                    <div className="space-y-4">
                                        {DOCTOR_CHECKPOINTS.map((checkpoint, idx) => {
                                            const isPast = checkpoint.week < currentWeek;
                                            const isCurrent = checkpoint.week === currentWeek;
                                            const isNext = !isPast && !isCurrent && DOCTOR_CHECKPOINTS.filter(c => c.week >= currentWeek)[0]?.week === checkpoint.week;

                                            return (
                                                <div key={idx} className="relative pl-14">
                                                    {/* Timeline Dot */}
                                                    <div className={`absolute left-4 w-5 h-5 rounded-full border-2 transition-all ${
                                                        isPast ? 'bg-green-400 border-green-400' :
                                                        isCurrent ? 'bg-pink-400 border-pink-400 animate-pulse-soft scale-125' :
                                                        'bg-white border-gray-300'
                                                    }`}>
                                                        {isPast && <span className="absolute inset-0 flex items-center justify-center text-white text-[10px]">✓</span>}
                                                    </div>

                                                    <div className={`watercolor-card rounded-2xl p-4 transition-all ${
                                                        isCurrent ? 'ring-2 ring-pink-300 shadow-lg' :
                                                        isNext ? 'ring-1 ring-purple-200' : ''
                                                    } ${isPast ? 'opacity-60' : ''}`}>
                                                        <div className="flex items-start justify-between">
                                                            <div className="flex items-start gap-3">
                                                                <span className="text-2xl">{checkpoint.icon}</span>
                                                                <div>
                                                                    <div className="flex items-center gap-2">
                                                                        <h3 className="font-semibold text-sm">{checkpoint.title}</h3>
                                                                        {isCurrent && <span className="px-2 py-0.5 rounded-full bg-pink-100 text-pink-600 text-[10px] font-medium">THIS WEEK</span>}
                                                                        {isNext && <span className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-600 text-[10px] font-medium">NEXT UP</span>}
                                                                    </div>
                                                                    <p className="text-xs text-gray-400 mt-0.5">Week {checkpoint.week}</p>
                                                                    <p className="text-xs text-gray-500 mt-1">{checkpoint.desc}</p>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Tests Checklist */}
                                                        <div className="mt-3 pt-3 border-t border-pink-50">
                                                            <p className="text-[10px] font-semibold text-gray-400 uppercase mb-2">Tests & Procedures</p>
                                                            <div className="space-y-1.5">
                                                                {checkpoint.tests.map((test, tIdx) => (
                                                                    <label key={tIdx} className="flex items-center gap-2 cursor-pointer group">
                                                                        <input type="checkbox"
                                                                            checked={checkedTests[`${checkpoint.week}-${tIdx}`] || false}
                                                                            onChange={() => toggleTest(checkpoint.week, tIdx)}
                                                                            className="checkbox-custom" style={{ width: 16, height: 16 }} />
                                                                        <span className={`text-xs group-hover:text-pink-500 transition-colors ${
                                                                            checkedTests[`${checkpoint.week}-${tIdx}`] ? 'line-through text-gray-300' : 'text-gray-600'
                                                                        }`}>{test}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: Journal */}
                        {activeTab === 'journal' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">Pregnancy Journal</h2>
                                    <p className="text-sm text-gray-400 mt-1">Capture your memories and feelings</p>
                                </div>

                                {/* New Entry */}
                                <div className="watercolor-card rounded-2xl p-5">
                                    <h3 className="font-display font-semibold mb-3">Week {currentWeek} Entry</h3>
                                    <textarea
                                        value={currentJournal}
                                        onChange={e => setCurrentJournal(e.target.value)}
                                        placeholder="How are you feeling today? Any special moments to remember? 💕"
                                        className="w-full h-32 p-3 rounded-xl bg-white/60 border border-pink-100 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-pink-200 font-hand text-lg"
                                    />
                                    <button onClick={saveJournal}
                                        className="mt-3 px-6 py-2 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 text-white text-sm font-medium hover:shadow-lg transition-all">
                                        Save Entry 💌
                                    </button>
                                </div>

                                {/* Past Entries */}
                                {Object.entries(journalEntries).sort((a, b) => b[0] - a[0]).map(([week, entries]) => (
                                    <div key={week} className="watercolor-card rounded-2xl p-4">
                                        <h3 className="font-display font-semibold text-sm mb-3 flex items-center gap-2">
                                            <span className="w-6 h-6 rounded-full bg-gradient-to-br from-pink-300 to-purple-300 flex items-center justify-center text-white text-[10px]">{week}</span>
                                            Week {week}
                                        </h3>
                                        {entries.map((entry, i) => (
                                            <div key={i} className={`${i > 0 ? 'mt-3 pt-3 border-t border-pink-50' : ''}`}>
                                                <p className="text-sm text-gray-600 font-hand text-lg leading-relaxed">{entry.text}</p>
                                                <p className="text-[10px] text-gray-300 mt-1">{entry.date}</p>
                                            </div>
                                        ))}
                                    </div>
                                ))}

                                {Object.keys(journalEntries).length === 0 && (
                                    <div className="text-center py-8 text-gray-300">
                                        <span className="text-4xl block mb-3">📝</span>
                                        <p className="text-sm">Your journal is empty. Start writing!</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-pink-100/50 z-50">
                        <div className="max-w-2xl mx-auto flex justify-around py-2 px-2">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl transition-all ${
                                        activeTab === tab.id ? 'tab-active' : 'text-gray-400 hover:text-gray-600'
                                    }`}>
                                    <span className="text-lg">{tab.icon}</span>
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        // ─── WATER TRACKER COMPONENT ─────────────────────────────────
        function WaterTracker() {
            const [glasses, setGlasses] = useState(() => {
                const saved = localStorage.getItem('bloom-water-' + new Date().toDateString());
                return saved ? parseInt(saved) : 0;
            });

            useEffect(() => {
                localStorage.setItem('bloom-water-' + new Date().toDateString(), glasses);
            }, [glasses]);

            return (
                <div className="flex flex-wrap gap-2 items-center">
                    {Array.from({ length: 10 }).map((_, i) => (
                        <button key={i} onClick={() => setGlasses(i + 1)}
                            className={`w-8 h-10 rounded-lg transition-all text-lg ${
                                i < glasses
                                    ? 'bg-blue-100 scale-105'
                                    : 'bg-gray-50 opacity-40'
                            }`}>
                            {i < glasses ? '💧' : '○'}
                        </button>
                    ))}
                    <span className="text-xs text-gray-400 ml-2">{glasses}/10</span>
                </div>
            );
        }

        // ─── RENDER ──────────────────────────────────────────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
