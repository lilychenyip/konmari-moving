        // ─── HELPER: Calculate week from due date ─────────────────────
        function calcWeekFromDueDate(dueDateStr) {
            if (!dueDateStr) return null;
            const due = new Date(dueDateStr + 'T00:00:00');
            const now = new Date();
            const totalDays = 280;
            const daysLeft = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
            const daysPregnant = totalDays - daysLeft;
            const week = Math.floor(daysPregnant / 7) + 1;
            return Math.max(1, Math.min(40, week));
        }

        function calcDueDateFromLMP(lmpStr) {
            if (!lmpStr) return null;
            const lmp = new Date(lmpStr + 'T00:00:00');
            const due = new Date(lmp.getTime() + 280 * 24 * 60 * 60 * 1000);
            return due.toISOString().split('T')[0];
        }

        function WatercolorFruit({ fruit, size, color, fruitEmoji }) {
            const sizeNum = parseFloat(size);
            const displaySize = Math.min(40 + sizeNum * 2.5, 160);
            return (
                <div className="relative flex items-center justify-center" style={{ width: displaySize + 40, height: displaySize + 40 }}>
                    <svg width={displaySize + 40} height={displaySize + 40} viewBox="0 0 200 200">
                        <defs>
                            <filter id={`wc-${fruit.replace(/\s/g,'')}`}>
                                <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="5" result="turbulence" seed={fruit.length * 7}/>
                                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="12" xChannelSelector="R" yChannelSelector="G"/>
                            </filter>
                            <radialGradient id={`grad-${fruit.replace(/\s/g,'')}`} cx="40%" cy="40%">
                                <stop offset="0%" stopColor={color} stopOpacity="0.9"/>
                                <stop offset="60%" stopColor={color} stopOpacity="0.5"/>
                                <stop offset="100%" stopColor={color} stopOpacity="0.15"/>
                            </radialGradient>
                        </defs>
                        <circle cx="100" cy="100" r="80" fill={`url(#grad-${fruit.replace(/\s/g,'')})`} filter={`url(#wc-${fruit.replace(/\s/g,'')})`} />
                        <circle cx="100" cy="100" r="60" fill={color} opacity="0.2" filter={`url(#wc-${fruit.replace(/\s/g,'')})`} />
                    </svg>
                    <span className="absolute text-center animate-float" style={{ fontSize: Math.min(displaySize * 0.5, 70) }}>
                        {fruitEmoji}
                    </span>
                </div>
            );

            const labels = { 1: "First Trimester", 2: "Second Trimester", 3: "Third Trimester" };
            return (
                <span className={`inline-block px-3 py-1 rounded-full text-white text-xs font-medium bg-gradient-to-r ${colors[trimester]}`}>
                    {labels[trimester]}
                </span>
            );
        }

        function ProgressRing({ week, totalWeeks = 40 }) {
            const radius = 54;
            const circumference = 2 * Math.PI * radius;
            const progress = (week / totalWeeks) * circumference;
            const percentage = Math.round((week / totalWeeks) * 100);
            return (
                <div className="relative inline-flex items-center justify-center">
                    <svg width="130" height="130" viewBox="0 0 130 130">
                        <circle cx="65" cy="65" r={radius} fill="none" stroke="#F3E8FF" strokeWidth="8"/>
                        <circle cx="65" cy="65" r={radius} fill="none" stroke="url(#ring-gradient)" strokeWidth="8"
                            strokeDasharray={circumference} strokeDashoffset={circumference - progress}
                            strokeLinecap="round" transform="rotate(-90 65 65)" className="progress-ring"/>
                        <defs>
                            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stopColor="#F9A8D4"/>
                                <stop offset="100%" stopColor="#C4B5FD"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div className="absolute text-center">
                        <div className="text-2xl font-bold font-display bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">{percentage}%</div>
                        <div className="text-[10px] text-gray-400">complete</div>
                    </div>
                </div>
            );
        }

        // ─── WATER TRACKER ────────────────────────────────────────────
        function WaterTracker() {
            const [glasses, setGlasses] = useState(() => {
                const saved = localStorage.getItem('bloom-water-' + new Date().toDateString());
                return saved ? parseInt(saved) : 0;
            });
            useEffect(() => { localStorage.setItem('bloom-water-' + new Date().toDateString(), glasses); }, [glasses]);
            return (
                <div className="flex flex-wrap gap-2 items-center">
                    {Array.from({ length: 10 }).map((_, i) => (
                        <button key={i} onClick={() => setGlasses(i + 1)}
                            className={`w-8 h-10 rounded-lg transition-all text-lg ${i < glasses ? 'bg-blue-100 scale-105' : 'bg-gray-50 opacity-40'}`}>
                            {i < glasses ? '💧' : '○'}
                        </button>
                    ))}
                    <span className="text-xs text-gray-400 ml-2">{glasses}/10</span>
                </div>
            );
        }

        // ─── ONBOARDING SCREEN ────────────────────────────────────────
        function OnboardingScreen({ onComplete }) {
            const [mode, setMode] = useState(null);
            const [dateValue, setDateValue] = useState('');

            const handleSubmit = () => {
                if (!dateValue) return;
                let dueDate = dateValue;
                if (mode === 'lmp') {
                    dueDate = calcDueDateFromLMP(dateValue);
                }
                localStorage.setItem('bloom-due-date', dueDate);
                onComplete(dueDate);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="watercolor-card rounded-3xl p-8 max-w-md w-full text-center animate-fade-in">
                        <div className="text-6xl mb-4 animate-float">🌸</div>
                        <h1 className="text-4xl font-display font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-pink-300 bg-clip-text text-transparent mb-2">
                            Welcome to Bloom
                        </h1>
                        <p className="text-gray-500 font-hand text-xl mb-8">Your pregnancy journey starts here</p>

                        {!mode && (
                            <div className="space-y-3">
                                <p className="text-sm text-gray-600 mb-4">How would you like to get started?</p>
                                <button onClick={() => setMode('due')}
                                    className="w-full p-4 rounded-2xl watercolor-card hover:shadow-lg transition-all text-left">
                                    <p className="font-semibold text-sm">I know my due date</p>
                                    <p className="text-xs text-gray-400 mt-1">Enter your estimated due date</p>
                                </button>
                                <button onClick={() => setMode('lmp')}
                                    className="w-full p-4 rounded-2xl watercolor-card hover:shadow-lg transition-all text-left">
                                    <p className="font-semibold text-sm">I know my last period date</p>
                                    <p className="text-xs text-gray-400 mt-1">We'll calculate your due date (LMP + 280 days)</p>
                                </button>
                            </div>
                        )}

                        {mode && (
                            <div className="space-y-4 animate-fade-in">
                                <p className="text-sm text-gray-600">
                                    {mode === 'due' ? 'When is your due date?' : 'When was the first day of your last period?'}
                                </p>
                                <input type="date" value={dateValue} onChange={e => setDateValue(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/80 text-center text-lg focus:outline-none focus:ring-2 focus:ring-pink-300" />
                                {mode === 'lmp' && dateValue && (
                                    <p className="text-xs text-purple-500">
                                        Estimated due date: {new Date(calcDueDateFromLMP(dateValue)).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}
                                    </p>
                                )}
                                <div className="flex gap-3">
                                    <button onClick={() => { setMode(null); setDateValue(''); }}
                                        className="flex-1 px-4 py-2 rounded-full border border-pink-200 text-sm text-gray-500 hover:bg-pink-50 transition-all">
                                        Back
                                    </button>
                                    <button onClick={handleSubmit} disabled={!dateValue}
                                        className="flex-1 px-4 py-3 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 text-white font-medium hover:shadow-lg transition-all disabled:opacity-40">
                                        Start My Journey
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ─── MAIN APP ─────────────────────────────────────────────────
        function App() {
            const [dueDateInput, setDueDateInput] = useState(() => localStorage.getItem('bloom-due-date') || '');
            const [hasOnboarded, setHasOnboarded] = useState(() => !!localStorage.getItem('bloom-due-date'));
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedDay, setSelectedDay] = useState(new Date().getDay());
            const [completedWorkouts, setCompletedWorkouts] = useState(() => {
                const saved = localStorage.getItem('bloom-completed-workouts');
                return saved ? JSON.parse(saved) : {};
            });
            const [showSettings, setShowSettings] = useState(false);
            const [expandedMeal, setExpandedMeal] = useState(null);
            const [journalEntries, setJournalEntries] = useState(() => {
                const saved = localStorage.getItem('bloom-journal');
                return saved ? JSON.parse(saved) : {};
            });
            const [currentJournal, setCurrentJournal] = useState('');
            const [checkedTests, setCheckedTests] = useState(() => {
                const saved = localStorage.getItem('bloom-checked-tests');
                return saved ? JSON.parse(saved) : {};
            });
            const [appointmentDetails, setAppointmentDetails] = useState(() => {
                const saved = localStorage.getItem('bloom-appointments');
                return saved ? JSON.parse(saved) : {};
            });
            const [editingAppt, setEditingAppt] = useState(null);

            const currentWeek = useMemo(() => calcWeekFromDueDate(dueDateInput) || 8, [dueDateInput]);
            const weekData = WEEK_DATA[currentWeek - 1] || WEEK_DATA[0];
            const trimester = weekData.trimester;
            const nutritionFocus = TRIMESTER_NUTRITION_FOCUS[trimester];
            const workoutPlan = WORKOUT_PLANS[trimester];
            const mealPlan = MEAL_PLANS[trimester];

            useEffect(() => { localStorage.setItem('bloom-completed-workouts', JSON.stringify(completedWorkouts)); }, [completedWorkouts]);
            useEffect(() => { localStorage.setItem('bloom-due-date', dueDateInput); }, [dueDateInput]);
            useEffect(() => { localStorage.setItem('bloom-journal', JSON.stringify(journalEntries)); }, [journalEntries]);
            useEffect(() => { localStorage.setItem('bloom-checked-tests', JSON.stringify(checkedTests)); }, [checkedTests]);
            useEffect(() => { localStorage.setItem('bloom-appointments', JSON.stringify(appointmentDetails)); }, [appointmentDetails]);

            const toggleWorkout = (dayIdx, exIdx) => {
                const key = `${currentWeek}-${dayIdx}-${exIdx}`;
                setCompletedWorkouts(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const toggleTest = (weekNum, testIdx) => {
                const key = `${weekNum}-${testIdx}`;
                setCheckedTests(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const saveJournal = () => {
                if (currentJournal.trim()) {
                    setJournalEntries(prev => ({
                        ...prev,
                        [currentWeek]: [...(prev[currentWeek] || []), { text: currentJournal, date: new Date().toLocaleDateString() }]
                    }));
                    setCurrentJournal('');
                }
            };

            const updateAppointment = (week, field, value) => {
                setAppointmentDetails(prev => ({
                    ...prev,
                    [week]: { ...(prev[week] || {}), [field]: value }
                }));
            };

            const daysUntilDue = useMemo(() => {
                if (!dueDateInput) return null;
                const due = new Date(dueDateInput + 'T00:00:00');
                const now = new Date();
                const diff = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
                return diff > 0 ? diff : 0;
            }, [dueDateInput]);

            const handleOnboardComplete = (dueDate) => {
                setDueDateInput(dueDate);
                setHasOnboarded(true);
            };

            const handleResetDueDate = () => {
                localStorage.removeItem('bloom-due-date');
                setDueDateInput('');
                setHasOnboarded(false);
            };

            if (!hasOnboarded) {
                return <OnboardingScreen onComplete={handleOnboardComplete} />;
            }

            const tabs = [
                { id: 'overview', label: 'Overview', icon: '🌸' },
                { id: 'nutrition', label: 'Nutrition', icon: '🥗' },
                { id: 'workout', label: 'Workout', icon: '🧘' },
                { id: 'doctor', label: 'Doctor', icon: '🩺' },
                { id: 'journal', label: 'Journal', icon: '📔' }
            ];
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <header className="sticky top-0 z-50 backdrop-blur-lg bg-white/70 border-b border-pink-100/50">
                        <div className="max-w-2xl mx-auto px-4 py-3">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-display font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-pink-300 bg-clip-text text-transparent">Bloom</h1>
                                    <p className="text-xs text-gray-400 font-hand text-lg -mt-1">your pregnancy journey</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    {daysUntilDue !== null && (
                                        <div className="text-right">
                                            <div className="text-lg font-bold font-display text-purple-400">{daysUntilDue}</div>
                                            <div className="text-[10px] text-gray-400">days to go</div>
                                        </div>
                                    )}
                                    <button onClick={() => setShowSettings(!showSettings)}
                                        className="w-9 h-9 rounded-full bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center hover:shadow-md transition-all">
                                        ⚙️
                                    </button>
                                </div>
                            </div>

                            {showSettings && (
                                <div className="mt-3 p-4 rounded-2xl watercolor-card animate-fade-in">
                                    <div className="flex flex-col gap-3">
                                        <div>
                                            <label className="text-xs font-medium text-gray-500 mb-1 block">Due Date</label>
                                            <input type="date" value={dueDateInput} onChange={e => setDueDateInput(e.target.value)}
                                                className="w-full px-3 py-2 rounded-xl border border-pink-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300" />
                                        </div>
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-xs font-medium text-gray-500">Auto-calculated Week</p>
                                                <p className="text-sm font-bold text-purple-500">Week {currentWeek} of 40</p>
                                            </div>
                                            <button onClick={handleResetDueDate}
                                                className="text-xs text-red-400 hover:text-red-600 transition-colors px-3 py-1 rounded-full border border-red-200 hover:bg-red-50">
                                                Reset
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Week Selector Ribbon */}
                    <div className="overflow-x-auto scrollbar-hide py-3 px-2 bg-white/30">
                        <div className="flex gap-1.5 max-w-2xl mx-auto" style={{ width: 'max-content', paddingLeft: '1rem', paddingRight: '1rem' }}>
                            {WEEK_DATA.map((w) => (
                                <button key={w.week}
                                    className={`flex-shrink-0 w-10 h-10 rounded-full text-xs font-medium transition-all cursor-default ${
                                        currentWeek === w.week
                                            ? 'bg-gradient-to-br from-pink-400 to-purple-400 text-white shadow-lg scale-110'
                                            : w.week < currentWeek
                                                ? 'bg-pink-100 text-pink-500'
                                                : 'bg-gray-100 text-gray-400'
                                    }`}>
                                    {w.week}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-2xl mx-auto px-4 py-4">
                        {/* Tab: Overview */}
                        {activeTab === 'overview' && (
                            <div className="animate-fade-in space-y-6">
                                <div className="watercolor-card rounded-3xl p-6 text-center">
                                    <TrimesterBadge trimester={trimester} />
                                    <h2 className="text-3xl font-display font-bold mt-3 mb-1">Week {currentWeek}</h2>
                                    <p className="text-gray-500 text-sm mb-4">Baby is the size of a <span className="font-semibold text-pink-500">{weekData.fruit}</span></p>
                                    <div className="flex justify-center mb-4">
                                        <WatercolorFruit fruit={weekData.fruit} size={weekData.size} color={weekData.color} fruitEmoji={weekData.fruitEmoji} />
                                    </div>
                                    <div className="inline-block px-4 py-1.5 rounded-full bg-white/60 text-sm">📏 {weekData.size} long</div>
                                    <p className="mt-4 text-gray-600 leading-relaxed text-sm">{weekData.dev}</p>
                                </div>

                                <div className="grid grid-cols-3 gap-3">
                                    <div className="watercolor-card rounded-2xl p-4 text-center">
                                        <ProgressRing week={currentWeek} />
                                        <p className="text-xs text-gray-400 mt-2">Progress</p>
                                    </div>
                                    <div className="watercolor-card rounded-2xl p-4 text-center flex flex-col items-center justify-center">
                                        <div className="text-3xl font-display font-bold text-purple-400">{40 - currentWeek}</div>
                                        <p className="text-xs text-gray-400 mt-1">Weeks Left</p>
                                        <div className="text-lg mt-1">⏳</div>
                                    </div>
                                    <div className="watercolor-card rounded-2xl p-4 text-center flex flex-col items-center justify-center">
                                        <div className="text-3xl font-display font-bold text-pink-400">{currentWeek}</div>
                                        <p className="text-xs text-gray-400 mt-1">Weeks Done</p>
                                        <div className="text-lg mt-1">✨</div>
                                    </div>
                                </div>

                                {/* Upcoming Appointments */}
                                {(() => {
                                    const upcoming = DOCTOR_CHECKPOINTS.filter(c => c.week >= currentWeek).slice(0, 2);
                                    if (upcoming.length === 0) return null;
                                    return (
                                        <div className="watercolor-card rounded-2xl p-4">
                                            <h3 className="font-display font-semibold text-lg mb-3">Upcoming Appointments</h3>
                                            {upcoming.map((apt, i) => {
                                                const apptData = appointmentDetails[apt.week] || {};
                                                return (
                                                    <div key={i} className={`flex items-start gap-3 ${i > 0 ? 'mt-3 pt-3 border-t border-pink-100' : ''}`}>
                                                        <span className="text-2xl">{apt.icon}</span>
                                                        <div className="flex-1">
                                                            <p className="font-medium text-sm">{apt.title}</p>
                                                            <p className="text-xs text-gray-400">
                                                                Week {apt.week} {apt.week === currentWeek ? '— This week!' : `— In ${apt.week - currentWeek} weeks`}
                                                            </p>
                                                            {apptData.date && (
                                                                <p className="text-xs text-purple-500 mt-0.5">📅 {new Date(apptData.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</p>
                                                            )}
                                                            {apptData.location && (
                                                                <p className="text-xs text-pink-500 mt-0.5">📍 {apptData.location}</p>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })()}

                                <div className="watercolor-card rounded-2xl p-4">
                                    <h3 className="font-display font-semibold text-lg mb-2">Today's Nutrition Focus</h3>
                                    <div className="flex items-start gap-3">
                                        <span className="text-2xl">🥑</span>
                                        <div>
                                            <p className="font-medium text-sm">{nutritionFocus.focus}</p>
                                            <div className="flex flex-wrap gap-1.5 mt-2">
                                                {nutritionFocus.nutrients.map((n, i) => (
                                                    <span key={i} className="px-2 py-0.5 rounded-full bg-green-50 text-green-600 text-xs">{n}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="watercolor-card rounded-2xl p-4 cursor-pointer" onClick={() => setActiveTab('workout')}>
                                    <h3 className="font-display font-semibold text-lg mb-2">Today's Workout</h3>
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl">🧘</span>
                                        <div>
                                            <p className="font-medium text-sm">{workoutPlan.days[new Date().getDay()].title}</p>
                                            <p className="text-xs text-gray-400">{workoutPlan.days[new Date().getDay()].duration}</p>
                                        </div>
                                        <span className="ml-auto text-gray-300">→</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: Nutrition */}
                        {activeTab === 'nutrition' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">Nutrition & Meal Plan</h2>
                                    <p className="text-sm text-gray-400 mt-1">Week {currentWeek} · {TRIMESTER_NUTRITION_FOCUS[trimester].focus}</p>
                                </div>

                                <div className="watercolor-card rounded-2xl p-4">
                                    <h3 className="font-semibold text-sm mb-3 flex items-center gap-2">✅ Key Nutrients This Trimester</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {nutritionFocus.nutrients.map((n, i) => (
                                            <div key={i} className="flex items-center gap-2 p-2 rounded-xl bg-green-50/60">
                                                <span className="w-2 h-2 rounded-full bg-green-400"></span>
                                                <span className="text-sm">{n}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="watercolor-card rounded-2xl p-4">
                                    <h3 className="font-semibold text-sm mb-3 flex items-center gap-2">⚠️ Foods to Avoid</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {nutritionFocus.avoid.map((item, i) => (
                                            <div key={i} className="flex items-center gap-2 p-2 rounded-xl bg-red-50/60">
                                                <span className="w-2 h-2 rounded-full bg-red-300"></span>
                                                <span className="text-sm text-red-700">{item}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Day selector */}
                                <div className="flex gap-2 justify-center">
                                    {dayNames.map((d, i) => (
                                        <button key={d} onClick={() => setSelectedDay(i)}
                                            className={`w-10 h-10 rounded-full text-xs font-medium transition-all ${
                                                selectedDay === i
                                                    ? 'bg-gradient-to-br from-green-400 to-emerald-500 text-white shadow-md'
                                                    : 'bg-white/60 text-gray-500 hover:bg-green-50'
                                            }`}>
                                            {d}
                                        </button>
                                    ))}
                                </div>

                                {/* Daily Meal Plan */}
                                {(() => {
                                    const todayMeal = mealPlan[selectedDay];
                                    if (!todayMeal) return null;

                                    const MealCard = ({ meal, type, emoji, colorClass }) => (
                                        <div className={`meal-section ${colorClass}`}>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span>{emoji}</span>
                                                <span className="text-xs font-semibold uppercase text-gray-400">{type}</span>
                                            </div>
                                            <div className="watercolor-card rounded-2xl p-4 cursor-pointer"
                                                onClick={() => setExpandedMeal(expandedMeal === `${selectedDay}-${type}` ? null : `${selectedDay}-${type}`)}>
                                                <h4 className="font-semibold text-sm">{meal.name}</h4>
                                                {meal.desc && <p className="text-xs text-gray-500 mt-0.5">{meal.desc}</p>}
                                                {expandedMeal === `${selectedDay}-${type}` && meal.ingredients && (
                                                    <div className="mt-3 pt-3 border-t border-pink-100 animate-fade-in">
                                                        <h5 className="text-[10px] font-semibold text-gray-400 uppercase mb-1">Ingredients</h5>
                                                        <ul className="space-y-0.5 mb-3">
                                                            {meal.ingredients.map((ing, i) => (
                                                                <li key={i} className="text-xs flex items-center gap-1.5">
                                                                    <span className="w-1 h-1 rounded-full bg-pink-300"></span>{ing}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                        {meal.instructions && (
                                                            <>
                                                                <h5 className="text-[10px] font-semibold text-gray-400 uppercase mb-1">Instructions</h5>
                                                                <p className="text-xs text-gray-600">{meal.instructions}</p>
                                                            </>
                                                        )}
                                                    </div>
                                                )}
                                                {!expandedMeal || expandedMeal !== `${selectedDay}-${type}` ? (
                                                    <p className="text-[10px] text-gray-400 mt-1">Tap for recipe</p>
                                                ) : null}
                                            </div>
                                        </div>
                                    );

                                    return (
                                        <div className="space-y-3">
                                            <h3 className="font-display font-semibold text-lg text-center">{todayMeal.day}'s Meal Plan</h3>
                                            <MealCard meal={todayMeal.breakfast} type="Breakfast" emoji="🌅" colorClass="meal-breakfast" />
                                            <MealCard meal={todayMeal.lunch} type="Lunch" emoji="☀️" colorClass="meal-lunch" />
                                            <MealCard meal={todayMeal.dinner} type="Dinner" emoji="🌙" colorClass="meal-dinner" />
                                            <MealCard meal={todayMeal.snack} type="Snack" emoji="🍎" colorClass="meal-snack" />
                                        </div>
                                    );
                                })()}

                                <div className="watercolor-card rounded-2xl p-4">
                                    <h3 className="font-semibold text-sm mb-3 flex items-center gap-2">💧 Daily Water Intake</h3>
                                    <p className="text-xs text-gray-400 mb-3">Aim for 8-10 glasses per day</p>
                                    <WaterTracker />
                                </div>
                            </div>
                        )}

                        {/* Tab: Workout */}
                        {activeTab === 'workout' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">{workoutPlan.name}</h2>
                                    <p className="text-sm text-gray-400 mt-1">{workoutPlan.note}</p>
                                </div>

                                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-start gap-3">
                                    <span className="text-xl">⚠️</span>
                                    <div>
                                        <p className="text-sm font-medium text-amber-800">Safety Reminder</p>
                                        <p className="text-xs text-amber-600 mt-1">Always consult your healthcare provider before exercising. Stop if you feel dizzy, short of breath, or experience any pain.</p>
                                    </div>
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-2">
                                    {workoutPlan.days.map((d, i) => (
                                        <button key={i} onClick={() => setSelectedDay(i)}
                                            className={`flex-shrink-0 px-4 py-2 rounded-full text-xs font-medium transition-all ${
                                                selectedDay === i
                                                    ? 'bg-gradient-to-r from-purple-400 to-pink-400 text-white shadow-md'
                                                    : 'bg-white/60 text-gray-500 hover:bg-purple-50'
                                            }`}>
                                            {d.day}
                                        </button>
                                    ))}
                                </div>

                                {(() => {
                                    const dayPlan = workoutPlan.days[selectedDay];
                                    const dayExercises = dayPlan.exercises;
                                    const completedCount = dayExercises.filter((_, i) => completedWorkouts[`${currentWeek}-${selectedDay}-${i}`]).length;
                                    const allCompleted = completedCount === dayExercises.length;

                                    return (
                                        <div className="watercolor-card rounded-2xl p-5">
                                            <div className="flex items-center justify-between mb-4">
                                                <div>
                                                    <h3 className="font-display font-semibold text-lg">{dayPlan.title}</h3>
                                                    <p className="text-xs text-gray-400">⏱ {dayPlan.duration}</p>
                                                </div>
                                                {allCompleted && <span className="text-2xl animate-float">🎉</span>}
                                            </div>

                                            {/* YouTube Video Link */}
                                            {dayPlan.youtube && (
                                                <a href={dayPlan.youtube.url} target="_blank" rel="noopener noreferrer"
                                                    className="yt-btn mb-4 inline-flex">
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                                                    {dayPlan.youtube.title}
                                                </a>
                                            )}

                                            <div className="h-2 rounded-full bg-gray-100 mb-4 overflow-hidden">
                                                <div className="h-full rounded-full bg-gradient-to-r from-purple-400 to-pink-400 transition-all duration-500"
                                                    style={{ width: `${(completedCount / dayExercises.length) * 100}%` }}></div>
                                            </div>
                                            <p className="text-xs text-gray-400 mb-4">{completedCount}/{dayExercises.length} completed</p>

                                            <div className="space-y-3">
                                                {dayExercises.map((ex, i) => {
                                                    const isComplete = completedWorkouts[`${currentWeek}-${selectedDay}-${i}`];
                                                    return (
                                                        <div key={i} className={`workout-card flex items-center gap-3 p-3 rounded-xl transition-all ${
                                                            isComplete ? 'bg-green-50/60' : 'bg-white/40'
                                                        }`}>
                                                            <input type="checkbox" checked={isComplete || false}
                                                                onChange={() => toggleWorkout(selectedDay, i)}
                                                                className="checkbox-custom" />
                                                            <div className="flex-1">
                                                                <p className={`text-sm font-medium ${isComplete ? 'line-through text-gray-400' : ''}`}>{ex.name}</p>
                                                                <div className="flex items-center gap-2 mt-0.5">
                                                                    {ex.duration && <span className="text-xs text-purple-400">⏱ {ex.duration}</span>}
                                                                    {ex.reps && <span className="text-xs text-pink-400">🔄 {ex.reps}</span>}
                                                                </div>
                                                                {ex.note && <p className="text-xs text-gray-400 mt-0.5">{ex.note}</p>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {/* Tab: Doctor */}
                        {activeTab === 'doctor' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">Doctor Checkpoints</h2>
                                    <p className="text-sm text-gray-400 mt-1">Your prenatal care timeline</p>
                                </div>

                                <div className="relative">
                                    <div className="absolute left-6 top-0 bottom-0 w-0.5 bg-gradient-to-b from-pink-300 via-purple-300 to-pink-300"></div>
                                    <div className="space-y-4">
                                        {DOCTOR_CHECKPOINTS.map((checkpoint, idx) => {
                                            const isPast = checkpoint.week < currentWeek;
                                            const isCurrent = checkpoint.week === currentWeek;
                                            const isNext = !isPast && !isCurrent && DOCTOR_CHECKPOINTS.filter(c => c.week >= currentWeek)[0]?.week === checkpoint.week;
                                            const apptData = appointmentDetails[checkpoint.week] || {};
                                            const isEditing = editingAppt === checkpoint.week;

                                            return (
                                                <div key={idx} className="relative pl-14">
                                                    <div className={`absolute left-4 w-5 h-5 rounded-full border-2 transition-all ${
                                                        isPast ? 'bg-green-400 border-green-400' :
                                                        isCurrent ? 'bg-pink-400 border-pink-400 animate-pulse-soft scale-125' :
                                                        'bg-white border-gray-300'
                                                    }`}>
                                                        {isPast && <span className="absolute inset-0 flex items-center justify-center text-white text-[10px]">✓</span>}
                                                    </div>

                                                    <div className={`watercolor-card rounded-2xl p-4 transition-all ${
                                                        isCurrent ? 'ring-2 ring-pink-300 shadow-lg' :
                                                        isNext ? 'ring-1 ring-purple-200' : ''
                                                    } ${isPast ? 'opacity-60' : ''}`}>
                                                        <div className="flex items-start justify-between">
                                                            <div className="flex items-start gap-3 flex-1">
                                                                <span className="text-2xl">{checkpoint.icon}</span>
                                                                <div className="flex-1">
                                                                    <div className="flex items-center gap-2 flex-wrap">
                                                                        <h3 className="font-semibold text-sm">{checkpoint.title}</h3>
                                                                        {isCurrent && <span className="px-2 py-0.5 rounded-full bg-pink-100 text-pink-600 text-[10px] font-medium">THIS WEEK</span>}
                                                                        {isNext && <span className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-600 text-[10px] font-medium">NEXT UP</span>}
                                                                    </div>
                                                                    <p className="text-xs text-gray-400 mt-0.5">Week {checkpoint.week}</p>
                                                                    <p className="text-xs text-gray-500 mt-1">{checkpoint.desc}</p>

                                                                    {/* Appointment date & location display */}
                                                                    {!isEditing && (apptData.date || apptData.location) && (
                                                                        <div className="mt-2 flex flex-wrap gap-2">
                                                                            {apptData.date && (
                                                                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-purple-50 text-purple-600 text-[10px]">
                                                                                    📅 {new Date(apptData.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                                                                                </span>
                                                                            )}
                                                                            {apptData.location && (
                                                                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-pink-50 text-pink-600 text-[10px]">
                                                                                    📍 {apptData.location}
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                    )}

                                                                    {/* Edit form */}
                                                                    {isEditing && (
                                                                        <div className="mt-2 space-y-2 animate-fade-in">
                                                                            <div>
                                                                                <label className="text-[10px] text-gray-400 block mb-0.5">Appointment Date</label>
                                                                                <input type="date" value={apptData.date || ''}
                                                                                    onChange={e => updateAppointment(checkpoint.week, 'date', e.target.value)}
                                                                                    className="w-full px-2 py-1.5 rounded-lg border border-pink-200 bg-white/80 text-xs focus:outline-none focus:ring-1 focus:ring-pink-300" />
                                                                            </div>
                                                                            <div>
                                                                                <label className="text-[10px] text-gray-400 block mb-0.5">Clinic / Location</label>
                                                                                <input type="text" value={apptData.location || ''} placeholder="e.g. Dr. Smith's Office"
                                                                                    onChange={e => updateAppointment(checkpoint.week, 'location', e.target.value)}
                                                                                    className="w-full px-2 py-1.5 rounded-lg border border-pink-200 bg-white/80 text-xs focus:outline-none focus:ring-1 focus:ring-pink-300" />
                                                                            </div>
                                                                            <button onClick={() => setEditingAppt(null)}
                                                                                className="text-xs px-3 py-1 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 text-white">
                                                                                Done
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <button onClick={() => setEditingAppt(isEditing ? null : checkpoint.week)}
                                                                className="text-gray-300 hover:text-pink-400 transition-colors ml-2 flex-shrink-0"
                                                                title="Edit appointment details">
                                                                {isEditing ? '✕' : '✏️'}
                                                            </button>
                                                        </div>

                                                        <div className="mt-3 pt-3 border-t border-pink-50">
                                                            <p className="text-[10px] font-semibold text-gray-400 uppercase mb-2">Tests & Procedures</p>
                                                            <div className="space-y-1.5">
                                                                {checkpoint.tests.map((test, tIdx) => (
                                                                    <label key={tIdx} className="flex items-center gap-2 cursor-pointer group">
                                                                        <input type="checkbox"
                                                                            checked={checkedTests[`${checkpoint.week}-${tIdx}`] || false}
                                                                            onChange={() => toggleTest(checkpoint.week, tIdx)}
                                                                            className="checkbox-custom" style={{ width: 16, height: 16 }} />
                                                                        <span className={`text-xs group-hover:text-pink-500 transition-colors ${
                                                                            checkedTests[`${checkpoint.week}-${tIdx}`] ? 'line-through text-gray-300' : 'text-gray-600'
                                                                        }`}>{test}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: Journal */}
                        {activeTab === 'journal' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="text-center mb-2">
                                    <h2 className="text-2xl font-display font-bold">Pregnancy Journal</h2>
                                    <p className="text-sm text-gray-400 mt-1">Capture your memories and feelings</p>
                                </div>

                                <div className="watercolor-card rounded-2xl p-5">
                                    <h3 className="font-display font-semibold mb-3">Week {currentWeek} Entry</h3>
                                    <textarea
                                        value={currentJournal}
                                        onChange={e => setCurrentJournal(e.target.value)}
                                        placeholder="How are you feeling today? Any special moments to remember?"
                                        className="w-full h-32 p-3 rounded-xl bg-white/60 border border-pink-100 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-pink-200 font-hand text-lg"
                                    />
                                    <button onClick={saveJournal}
                                        className="mt-3 px-6 py-2 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 text-white text-sm font-medium hover:shadow-lg transition-all">
                                        Save Entry
                                    </button>
                                </div>

                                {Object.entries(journalEntries).sort((a, b) => b[0] - a[0]).map(([week, entries]) => (
                                    <div key={week} className="watercolor-card rounded-2xl p-4">
                                        <h3 className="font-display font-semibold text-sm mb-3 flex items-center gap-2">
                                            <span className="w-6 h-6 rounded-full bg-gradient-to-br from-pink-300 to-purple-300 flex items-center justify-center text-white text-[10px]">{week}</span>
                                            Week {week}
                                        </h3>
                                        {entries.map((entry, i) => (
                                            <div key={i} className={`${i > 0 ? 'mt-3 pt-3 border-t border-pink-50' : ''}`}>
                                                <p className="text-sm text-gray-600 font-hand text-lg leading-relaxed">{entry.text}</p>
                                                <p className="text-[10px] text-gray-300 mt-1">{entry.date}</p>
                                            </div>
                                        ))}
                                    </div>
                                ))}

                                {Object.keys(journalEntries).length === 0 && (
                                    <div className="text-center py-8 text-gray-300">
                                        <span className="text-4xl block mb-3">📝</span>
                                        <p className="text-sm">Your journal is empty. Start writing!</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-pink-100/50 z-50">
                        <div className="max-w-2xl mx-auto flex justify-around py-2 px-2">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl transition-all ${
                                        activeTab === tab.id ? 'tab-active' : 'text-gray-400 hover:text-gray-600'
                                    }`}>
                                    <span className="text-lg">{tab.icon}</span>
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
